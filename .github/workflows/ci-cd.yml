name: SCMIRN CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scmirn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install backend development dependencies
        run: python -m pip install --require-hashes -r src/backend/requirements-dev.lock
      - name: Backend tests and production policy tests
        run: python -m pytest -q -p no:cacheprovider src/backend/tests
      - name: Feature parity completeness
        run: python scripts/check_feature_parity.py
      - name: OpenAPI syntax and route presence
        run: python scripts/validate_openapi_contract.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix src/frontend
      - name: Typecheck and build
        run: npm --prefix src/frontend run typecheck && npm --prefix src/frontend run build
      - name: Install Chromium for browser tests
        run: npx --prefix src/frontend playwright install --with-deps chromium
      - name: Run browser tests
        run: npm --prefix src/frontend run test:e2e
