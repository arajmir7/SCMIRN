apiVersion: apps/v1
kind: Deployment
metadata:
  name: scmirn-enterprise-api
  labels:
    app: scmirn-enterprise-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scmirn-enterprise-api
  template:
    metadata:
      labels:
        app: scmirn-enterprise-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/scmirn-backend:enterprise-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scmirn-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: scmirn-secrets
                  key: redis_url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scmirn-enterprise-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scmirn-enterprise-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
