apiVersion: apps/v1
kind: Deployment
metadata:
  name: scmirn-frontend
  labels:
    app: scmirn-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scmirn-frontend
  template:
    metadata:
      labels:
        app: scmirn-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/scmirn-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: scmirn-frontend
spec:
  selector:
    app: scmirn-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

