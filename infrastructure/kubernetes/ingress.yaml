apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scmirn-ingress
  namespace: scmirn-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: scmirn.example.com
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: scmirn-frontend
                port:
                  number: 80
