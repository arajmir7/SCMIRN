apiVersion: batch/v1
kind: CronJob
metadata:
  name: scmirn-executive-briefing
  namespace: scmirn-prod
spec:
  # Intentionally paused: do not generate briefings until real, approved
  # authority data, recipients, and an operational owner are configured.
  suspend: true
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: briefing-worker
              image: ghcr.io/arajmir7/scmirn-backend:release-placeholder
              imagePullPolicy: Always
              command: ["python", "-c", "raise SystemExit('Briefing worker is disabled pending approved sources and recipients')"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
