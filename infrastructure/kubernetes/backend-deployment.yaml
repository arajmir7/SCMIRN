apiVersion: apps/v1
kind: Deployment
metadata:
  name: scmirn-backend
  labels:
    app: scmirn-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scmirn-backend
  template:
    metadata:
      labels:
        app: scmirn-backend
    spec:
      containers:
        - name: backend
          image: your-registry/scmirn-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: scmirn-secrets
            - configMapRef:
                name: scmirn-config
---
apiVersion: v1
kind: Service
metadata:
  name: scmirn-backend
spec:
  selector:
    app: scmirn-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000

