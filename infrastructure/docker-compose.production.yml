services:
  migrate:
    image: scmirn/backend:${SCMIRN_RELEASE_ID:?Set SCMIRN_RELEASE_ID in .env.production}
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    restart: "no"
    environment: &backend_environment
      APP_CONFIG: production
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SCMIRN_SECRET_KEY:?Set SCMIRN_SECRET_KEY in .env.production}
      JWT_SECRET_KEY: ${SCMIRN_JWT_SECRET_KEY:?Set SCMIRN_JWT_SECRET_KEY in .env.production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL using TLS in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS CORS_ORIGINS in .env.production}
      STAFF_API_ENABLED: ${STAFF_API_ENABLED:-false}
      SCMIRN_MIGRATION_MODE: "true"
      DEMO_MODE: "false"
      DATABASE_URL: ${SCMIRN_MIGRATION_DATABASE_URL:?Set SCMIRN_MIGRATION_DATABASE_URL for the separate migrator role}
    volumes:
      - type: bind
        source: ${SCMIRN_POSTGRES_CA_FILE:?Set SCMIRN_POSTGRES_CA_FILE in .env.production}
        target: /run/postgres-ca.crt
        read_only: true
      - type: bind
        source: ${SCMIRN_REDIS_CA_FILE:?Set SCMIRN_REDIS_CA_FILE in .env.production}
        target: /run/redis-ca.crt
        read_only: true
    command: ["flask", "--app", "wsgi:app", "db", "upgrade"]
    networks:
      - app
    security_opt:
      - no-new-privileges:true

  backend:
    image: scmirn/backend:${SCMIRN_RELEASE_ID:?Set SCMIRN_RELEASE_ID in .env.production}
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_environment
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the separate application role}
      SCMIRN_MIGRATION_MODE: "false"
      DEMO_MODE: "false"
    volumes:
      - type: bind
        source: ${SCMIRN_POSTGRES_CA_FILE:?Set SCMIRN_POSTGRES_CA_FILE in .env.production}
        target: /run/postgres-ca.crt
        read_only: true
      - type: bind
        source: ${SCMIRN_REDIS_CA_FILE:?Set SCMIRN_REDIS_CA_FILE in .env.production}
        target: /run/redis-ca.crt
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "5000"
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: scmirn/frontend:${SCMIRN_RELEASE_ID:?Set SCMIRN_RELEASE_ID in .env.production}
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCMIRN_HTTP_PORT:-8080}:80"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  app:
    driver: bridge
