{% extends "base.html" %}

{% block title %}Heatmap{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
            <div>
                <h2 class="display-5 fw-bold">Live Civic Heatmap</h2>
                <p class="text-muted mb-0">Explore priority issues across your city.</p>
            </div>
            <div class="mt-3 mt-md-0">
                <div class="btn-group">
                    <button class="btn btn-outline-dark active" onclick="filterMap('all')">All</button>
                    <button class="btn btn-outline-danger" onclick="filterMap('critical')">Critical</button>
                    <button class="btn btn-outline-warning" onclick="filterMap('high')">High</button>
                </div>
                <div class="map-search mt-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input
                            type="text"
                            id="mapSearchInput"
                            class="form-control"
                            placeholder="Search area, landmark, or issue..."
                            onkeypress="handleMapSearchKey(event)"
                        >
                        <button class="btn btn-dark" type="button" onclick="searchMapLocation()">
                            Search
                        </button>
                    </div>
                    <small id="mapSearchStatus" class="text-muted d-block mt-2"></small>
                </div>
            </div>
        </div>

        <div id="civicMap"></div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="application/json" id="scmirn-issues-data">
        {{ map_issues | tojson }}
    </script>
{% endblock %}
